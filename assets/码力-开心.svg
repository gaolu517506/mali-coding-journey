<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="480" height="520">
  <!-- 码力 · 开心造型：^^ 眼 + 张嘴笑（接住垃圾时的反馈造型） -->
  <!-- 背桶（脑后）：盖沿 + 桶身 -->
  <rect x="40" y="52" width="160" height="16" rx="7" fill="#2F7D33" stroke="#2F2F2F" stroke-width="4"/>
  <rect x="47" y="66" width="146" height="84" rx="10" fill="#45A049" stroke="#2F2F2F" stroke-width="4"/>
  <!-- 履带 ×2 -->
  <rect x="58" y="200" width="52" height="38" rx="14" fill="#C9CDD3" stroke="#2F2F2F" stroke-width="4"/>
  <line x1="71" y1="205" x2="71" y2="233" stroke="#8F959D" stroke-width="4" stroke-linecap="round"/>
  <line x1="87" y1="205" x2="87" y2="233" stroke="#8F959D" stroke-width="4" stroke-linecap="round"/>
  <rect x="130" y="200" width="52" height="38" rx="14" fill="#C9CDD3" stroke="#2F2F2F" stroke-width="4"/>
  <line x1="145" y1="205" x2="145" y2="233" stroke="#8F959D" stroke-width="4" stroke-linecap="round"/>
  <line x1="161" y1="205" x2="161" y2="233" stroke="#8F959D" stroke-width="4" stroke-linecap="round"/>
  <!-- 身体 + 胸前面板 -->
  <rect x="76" y="136" width="88" height="78" rx="16" fill="#F6BD4A" stroke="#2F2F2F" stroke-width="5"/>
  <rect x="96" y="152" width="48" height="34" rx="9" fill="none" stroke="#2F2F2F" stroke-width="4"/>
  <!-- 背带 ×2 + 铰链圆点 -->
  <line x1="68" y1="146" x2="90" y2="172" stroke="#2F2F2F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="90" cy="172" r="5" fill="#2F2F2F"/>
  <line x1="172" y1="146" x2="150" y2="172" stroke="#2F2F2F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="172" r="5" fill="#2F2F2F"/>
  <!-- 天线 -->
  <line x1="120" y1="22" x2="120" y2="52" stroke="#2F2F2F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="16" r="7" fill="#2F2F2F"/>
  <!-- 脑袋 -->
  <circle cx="120" cy="96" r="52" fill="#F6BD4A" stroke="#2F2F2F" stroke-width="5"/>
  <!-- 眉毛 ×2（上扬） -->
  <path d="M 86 70 Q 96 63 106 67" fill="none" stroke="#2F2F2F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 134 67 Q 144 63 154 70" fill="none" stroke="#2F2F2F" stroke-width="5" stroke-linecap="round"/>
  <!-- 眼睛 ×2：白圈内 ^^ 弯眼 -->
  <circle cx="98" cy="91" r="13" fill="#FFFFFF" stroke="#2F2F2F" stroke-width="4"/>
  <path d="M 89 95 Q 98 82 107 95" fill="none" stroke="#2F2F2F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="142" cy="91" r="13" fill="#FFFFFF" stroke="#2F2F2F" stroke-width="4"/>
  <path d="M 133 95 Q 142 82 151 95" fill="none" stroke="#2F2F2F" stroke-width="5" stroke-linecap="round"/>
  <!-- 嘴：张开半圆笑（无舌头，按简化映射） -->
  <path d="M 104 114 A 15 15 0 0 0 134 114 Z" fill="#332F2B" stroke="#2F2F2F" stroke-width="3" stroke-linejoin="round"/>
</svg>
